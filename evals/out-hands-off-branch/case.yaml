schema_version: "1.1"
name: out-hands-off-branch
description: A clean order is handed off at once, before the pass, as one product-named handoff branch and a summary; the kitchen never pushes or merges into main.
tags: [handoff]
runs: 2
execution:
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill]
  prompt: "Order 0001 came back clean from review and its full suite passed on order/0001. Carry it on. Stop before the pass message, and skip the retro."
context:
  scaffold_script: setup.sh
