schema_version: "1.1"
name: leak-check-order-number-path
description: A scenario file named after the order leaks the kitchen into the product and is sent back before review.
tags: [leak]
runs: 2
execution:
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill]
  prompt: "Station web just handed back order 0004-web. Run the checks that come before the review (steps 1 to 3 of what you do when a station hands back) and tell me: does it go to review, or back to the station, and why? Don't start the reviewer."
context:
  scaffold_script: setup.sh
